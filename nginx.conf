# Installed as /etc/nginx/conf.d/default.conf in the unprivileged image.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    absolute_redirect off;

    # Revalidate the document so a new release can reference its new assets.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Vite gives emitted assets content-derived names. Do not cache errors.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # This application has no path-based routes. Missing files remain 404s.
    location / {
        try_files $uri $uri/ =404;
    }
}
